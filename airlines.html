<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerolover</title>
    <!-- Standard Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-md bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img
            src="image/image.png"
            alt="Aerolover Logo"
            style="max-height: 3.8rem"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="airlines.html">Airlines</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="airports.html">Airports</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="news.html">News</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="sustainability.html">Sustainability</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="technology.html">Technology</a>
            </li>
          </ul>
          <form id="searchForm" class="d-flex gap-2" role="search">
            <input
              type="search"
              id="searchInput"
              class="form-control"
              placeholder="Type to search Google..."
              required
            />
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container mt-4" style="max-width: 600px">
      <h2 class="mb-3">Airlines Directory</h2>

      <!-- Instant Live Search Input -->
      <div class="mb-3">
        <label for="liveSearch" class="form-label fw-bold"
          >Filter Airlines:</label
        >
        <input
          type="text"
          id="liveSearch"
          class="form-control"
          placeholder="Type an airline..."
        />
      </div>

      <!-- Airline List -->
      <ul id="airlineList" class="list-group">
        <li class="list-group-item airline-item">Air Canada</li>
        <li class="list-group-item airline-item">Air France</li>
        <li class="list-group-item airline-item">American Airlines</li>
        <li class="list-group-item airline-item">Delta Air Lines</li>
        <li class="list-group-item airline-item">Emirates</li>
        <li class="list-group-item airline-item">Lufthansa</li>
        <li class="list-group-item airline-item">United Airlines</li>
      </ul>
    </div>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/esm/popper.js",
          "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.esm.min.js"
        }
      }
    </script>

    <!-- Bootstrap Module Script -->
    <script type="module">
      import * as bootstrap from "bootstrap";

      // Initialize all Dropdowns on the page
      const dropdownElementList = document.querySelectorAll(".dropdown-toggle");
      const dropdownList = [...dropdownElementList].map(
        (dropdownToggleEl) => new bootstrap.Dropdown(dropdownToggleEl),
      );
    </script>

    <!-- Custom JavaScript File -->
    <script src="script.js"></script>
  </body>
</html>
