<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerolover - Payment Verification</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div
      class="text-center card shadow border-0 p-5 rounded-4"
      style="max-width: 450px"
    >
      <div id="verifyingState">
        <div
          class="spinner-border text-primary mb-3"
          role="status"
          style="width: 3rem; height: 3rem"
        ></div>
        <h4 class="fw-bold">Verifying Payment...</h4>
        <p class="text-muted small">
          Please wait while we confirm your subscription transaction.
        </p>
      </div>

      <div id="failedState" class="d-none">
        <div class="fs-1 text-danger mb-2">❌</div>
        <h4 class="fw-bold text-danger">Verification Failed</h4>
        <p class="text-muted small">
          No valid payment record found for this session.
        </p>
        <a href="checkout.html" class="btn btn-primary rounded-pill px-4 mt-2"
          >Return to Checkout</a
        >
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
