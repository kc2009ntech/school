<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerolover - Choose New Password</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <style>
      .navbar-glass {
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg sticky-top navbar-glass border-bottom shadow-sm py-2"
    >
      <div class="container-fluid px-4">
        <a class="navbar-brand me-4" href="index.html">
          <img
            src="image/image.png"
            alt="Aerolover Logo"
            style="height: 3.2rem"
          />
        </a>
      </div>
    </nav>

    <!-- Reset Form Container -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-3">
              <h4 class="mb-0 fw-bold">Set New Password</h4>
            </div>
            <div class="card-body p-4 p-md-5">
              <div
                id="newPasswordAlert"
                class="alert alert-success d-none text-center small mb-4"
                role="alert"
              >
                Password updated successfully! Redirecting to sign in...
              </div>

              <form id="newPasswordForm">
                <div class="mb-3">
                  <label
                    for="newPasswordInput"
                    class="form-label small text-muted"
                    >New Password</label
                  >
                  <input
                    type="password"
                    id="newPasswordInput"
                    class="form-control"
                    placeholder="••••••••"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label
                    for="confirmPasswordInput"
                    class="form-label small text-muted"
                    >Confirm New Password</label
                  >
                  <input
                    type="password"
                    id="confirmPasswordInput"
                    class="form-control"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <button
                  type="submit"
                  class="btn btn-primary rounded-pill w-100 py-2 fw-semibold"
                >
                  Update Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script imports -->
    <script src="script.js"></script>
  </body>
</html>
