<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerolover - Checkout</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .navbar-glass {
        background-color: rgba(253, 252, 252, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .avatar-circle {
        width: 32px;
        height: 32px;
        background-color: #0d6efd;
        color: #faf6f6;
        font-weight: bold;
        font-size: 0.85rem;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg sticky-top navbar-glass border-bottom shadow-sm py-2"
    >
      <div class="container-fluid px-4">
        <a class="navbar-brand me-4" href="index.html">
          <img
            src="image/image.png"
            alt="Aerolover Logo"
            style="height: 3.2rem"
          />
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="airlines.html">Airlines</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="airports.html">Airports</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="latestnews.html">Latest news</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="sustainability.html">Sustainability</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="technology.html">Technology</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="airspace.html">Airspace</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>

          <div class="d-flex align-items-center gap-2">
            <!-- Account Dropdown -->
            <div class="dropdown">
              <button
                class="btn btn-outline-primary dropdown-toggle rounded-pill px-3 d-inline-flex align-items-center gap-2"
                type="button"
                id="dropdownMenuButton"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span id="navAvatarCircle" class="avatar-circle d-none"></span>
                <span id="navUserName">Account</span>
              </button>
              <ul
                class="dropdown-menu dropdown-menu-end shadow-sm"
                aria-labelledby="dropdownMenuButton"
              >
                <li>
                  <a class="dropdown-item" href="dashboard_settings.html"
                    >Account Settings</a
                  >
                </li>
                <li>
                  <a
                    class="dropdown-item text-warning fw-semibold"
                    href="plans.html"
                    >⚡ Upgrade Subscription</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <button class="dropdown-item text-danger" id="logoutBtn">
                    Sign Out
                  </button>
                </li>
              </ul>
            </div>

            <!-- Search Form -->
            <form id="searchForm" class="d-flex gap-2 ms-2" role="search">
              <div class="input-group">
                <input
                  type="search"
                  id="searchInput"
                  class="form-control rounded-start-pill"
                  placeholder="Search..."
                  required
                />
                <button type="submit" class="btn btn-primary rounded-end-pill">
                  Go
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
              <h3 class="fw-bold text-primary text-center mb-3">
                Complete Checkout
              </h3>
              <p class="text-muted text-center small mb-4">
                Aerolover Exclusive Pass — $9.99/month
              </p>

              <form id="checkoutForm">
                <div class="mb-3">
                  <label for="checkoutEmail" class="form-label small text-muted"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    id="checkoutEmail"
                    class="form-control rounded-pill px-3"
                    placeholder="captain@example.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="checkoutCard" class="form-label small text-muted"
                    >Card Number</label
                  >
                  <input
                    type="text"
                    id="checkoutCard"
                    class="form-control rounded-pill px-3"
                    placeholder="•••• •••• •••• 4242"
                    required
                  />
                </div>
                <div class="row g-2 mb-4">
                  <div class="col-6">
                    <label for="checkoutExp" class="form-label small text-muted"
                      >Expiry Date</label
                    >
                    <input
                      type="text"
                      id="checkoutExp"
                      class="form-control rounded-pill px-3"
                      placeholder="MM/YY"
                      required
                    />
                  </div>
                  <div class="col-6">
                    <label for="checkoutCvc" class="form-label small text-muted"
                      >CVC</label
                    >
                    <input
                      type="password"
                      id="checkoutCvc"
                      class="form-control rounded-pill px-3"
                      placeholder="123"
                      required
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  id="payButton"
                  class="btn btn-primary rounded-pill w-100 py-2 fw-semibold"
                >
                  Pay $9.99 & Proceed to Verification
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/esm/popper.js",
          "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.esm.min.js"
        }
      }
    </script>
    <script type="module">
      import * as bootstrap from "bootstrap";
    </script>
    <script src="script.js"></script>
  </body>
</html>
