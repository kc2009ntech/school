<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerolover - Checkout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <nav
    class="navbar navbar-expand-lg sticky-top navbar-glass border-bottom shadow-sm py-2"
  >
    <div class="container-fluid px-4">
      <a class="navbar-brand me-4" href="index.html">
        <img
          src="image/image.png"
          alt="Aerolover Logo"
          style="height: 3.2rem"
        />
      </a>
      <button
        class="navbar-toggler border-0"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarContent"
        aria-controls="navbarContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="airlines.html">Airlines</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="airports.html">Airports</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="news.html"
              >News</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sustainability.html">Sustainability</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="technology.html">Technology</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <!-- Account Dropdown -->
          <div class="dropdown">
            <button
              class="btn btn-outline-primary dropdown-toggle rounded-pill px-3"
              type="button"
              id="dropdownMenuButton"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Account
            </button>
            <ul
              class="dropdown-menu dropdown-menu-end shadow-sm"
              aria-labelledby="dropdownMenuButton"
            >
              <li>
                <a class="dropdown-item" href="unlock.html" id="option1"
                  >Exclusive Access</a
                >
              </li>
            </ul>
          </div>

          <!-- Search Redirect Form -->
          <form id="searchForm" class="d-flex gap-2" role="search">
            <div class="input-group">
              <input
                type="search"
                id="searchInput"
                class="form-control rounded-start-pill"
                placeholder="Search Google..."
                required
              />
              <button type="submit" class="btn btn-primary rounded-end-pill">
                Search
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </nav>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
              <h3 class="fw-bold text-primary text-center mb-3">
                Complete Checkout
              </h3>
              <p class="text-muted text-center small mb-4">
                Aerolover Exclusive Pass — $9.99/month
              </p>

              <form id="checkoutForm">
                <div class="mb-3">
                  <label for="checkoutEmail" class="form-label small text-muted"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    id="checkoutEmail"
                    class="form-control"
                    placeholder="captain@example.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="checkoutCard" class="form-label small text-muted"
                    >Card Number</label
                  >
                  <input
                    type="text"
                    id="checkoutCard"
                    class="form-control"
                    placeholder="•••• •••• •••• 4242"
                    required
                  />
                </div>
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="checkoutExp" class="form-label small text-muted"
                      >Expiry Date</label
                    >
                    <input
                      type="text"
                      id="checkoutExp"
                      class="form-control"
                      placeholder="MM/YY"
                      required
                    />
                  </div>
                  <div class="col-6">
                    <label for="checkoutCvc" class="form-label small text-muted"
                      >CVC</label
                    >
                    <input
                      type="password"
                      id="checkoutCvc"
                      class="form-control"
                      placeholder="123"
                      required
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  id="payButton"
                  class="btn btn-primary rounded-pill w-100 py-2 fw-semibold"
                >
                  Pay $9.99 & Proceed to Verification
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
