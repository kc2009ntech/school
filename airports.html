<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <title>Home</title>
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img
            src="image/image.png"
            alt="Aerolover Logo"
            style="max-height: 3.8rem"
          />
        </a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
          aria-controls="navbarDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDrawer"
          aria-labelledby="navbarDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="airlines.html">Airlines</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="airports.html">Airports</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="news.html">News</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="sustainability.html"
                  >Sustainability</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="technology.html">Technology</a>
              </li>
            </ul>
            <form class="hstack gap-2" role="search">
              <input
                class="form-control"
                style="margin-left: 68%"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <svg class="bi" width="16" height="16">
                  <use href="#search" />
                </svg>
              </button>
            </form>
          </div>
        </dialog>
      </div>
    </nav>
    <h1>Hello, modularity!</h1>
    <button
      id="popoverButton"
      type="button"
      class="btn-solid theme-primary btn-lg"
      data-bs-toggle="popover"
      title="ESM in Browser"
      data-bs-content="Bang!"
    >
      Get started
    </button>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/esm/popper.js",
          "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.esm.min.js"
        }
      }
    </script>

    <!-- Bootstrap Script -->
    <!-- Bootstrap Module Script -->
    <script type="module">
      import * as bootstrap from "bootstrap";

      // 1. Initialize the Popover (existing)
      const popoverBtn = document.getElementById("popoverButton");
      if (popoverBtn) {
        new bootstrap.Popover(popoverBtn);
      }

      // 2. Explicitly initialize all Dropdowns on the page
      const dropdownElementList = document.querySelectorAll(".dropdown-toggle");
      const dropdownList = [...dropdownElementList].map(
        (dropdownToggleEl) => new bootstrap.Dropdown(dropdownToggleEl),
      );
    </script>

    <!-- Your Custom JavaScript File -->
    <script src="script.js"></script>
  </body>
</html>
